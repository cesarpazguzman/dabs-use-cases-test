name: deploy-ingestion
on:
  pull_request:
    branches: [qa, main]
    paths: ["ingestion/**"]
  push:
    branches: [qa, main]   # qa -> qa target, main -> prd target
    paths: ["ingestion/**"]
jobs:
  ci:
    uses: cesarpazguzman/dabs-platform-test/.github/workflows/bundle-ci.yml@v1
    with:
      bundle_path: ingestion
    secrets: inherit
